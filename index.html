<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Glass Games Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(99,102,241,0.12), transparent 6%),
                  radial-gradient(1000px 500px at 90% 90%, rgba(16,185,129,0.08), transparent 8%),
                  linear-gradient(180deg, #0f172a 0%, #071024 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .glass {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 30px rgba(2,6,23,0.6);
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(2,6,23,0.6);
    }

    .hidden-until-auth { display: none; }
    input, button { outline: none; }
  </style>
</head>
<body class="text-slate-100">

  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-4xl">

      <!-- Header -->
      <header class="mb-6 flex items-center justify-between">
        <div class="glass p-4 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-white/5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white/90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 9l3 3-3 3M13 6h6" />
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-semibold leading-tight">Glass Games Portal</h1>
            <p class="text-xs text-white/60">Password protected • Mobile friendly</p>
          </div>
        </div>
      </header>

      <!-- Main card -->
      <main class="glass p-6 rounded-3xl">

        <!-- Password box -->
        <div id="loginCard" class="max-w-md mx-auto">
          <h2 class="text-2xl font-semibold mb-2">Enter password to continue</h2>
          <p class="text-sm text-white/60 mb-4">Client-side password — change in HTML.</p>
          <div class="flex gap-2">
            <input id="passwordInput" type="password" placeholder="Password" class="flex-1 rounded-xl p-3 bg-white/5 border border-white/6" />
            <button id="enterBtn" class="rounded-xl px-4 py-2 bg-indigo-600 hover:bg-indigo-500">Enter</button>
          </div>
          <p id="loginMsg" class="mt-3 text-sm text-rose-400 hidden">Wrong password</p>
        </div>

        <!-- Content after auth -->
        <div id="content" class="hidden-until-auth mt-6">

          <h3 class="text-lg font-semibold mb-4">Portal Controls</h3>

          <div class="flex flex-col gap-4">

            <!-- Cloak URL button -->
            <button onclick="cloakURL()" class="glass px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 w-full text-center">
              Cloak URL
            </button>

            <!-- Copy bookmarklet button -->
            <button onclick="copyBookmarklet()" class="glass px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 w-full text-center">
              Copy Bookmarklet
            </button>

            <p id="bookmarkMsg" class="text-sm text-green-400 hidden">Bookmarklet copied!</p>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script>
    // PASSWORD
    const PASSWORD = "letmein"; // change this

    const loginCard = document.getElementById('loginCard');
    const content = document.getElementById('content');
    const enterBtn = document.getElementById('enterBtn');
    const passwordInput = document.getElementById('passwordInput');
    const loginMsg = document.getElementById('loginMsg');
    const AUTH_KEY = 'glass_games_portal_authed_v1';

    function setAuthed() {
      sessionStorage.setItem(AUTH_KEY,'1');
      showContent();
    }

    function isAuthed() {
      return sessionStorage.getItem(AUTH_KEY) === '1';
    }

    function showContent() {
      loginCard.style.display = 'none';
      content.style.display = 'block';
    }

    if (isAuthed()) showContent();

    enterBtn.addEventListener('click', () => {
      if(passwordInput.value === PASSWORD){
        setAuthed();
        passwordInput.value = '';
        loginMsg.classList.add('hidden');
      } else {
        loginMsg.classList.remove('hidden');
      }
    });

    passwordInput.addEventListener('keydown', e => {
      if(e.key==='Enter') enterBtn.click();
    });

    // -------- Cloak & Bookmarklet functions --------
    function cloakURL() {
      // Replace current URL in the address bar with "about:blank" without reloading
      history.replaceState({}, '', 'about:blank');
      alert('URL cloaked to about:blank! You can now use a bookmarklet.');
    }

    function copyBookmarklet() {
      // Bookmarklet to open this portal inside about:blank
      const portalURL = window.location.href;
      const code = `javascript:(function(){window.open('${portalURL}','_blank');})();`;
      navigator.clipboard.writeText(code).then(() => {
        const msg = document.getElementById('bookmarkMsg');
        msg.classList.remove('hidden');
        setTimeout(()=>msg.classList.add('hidden'),2000);
      });
    }
  </script>
</body>
</html>
