<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cee Games Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
  min-height:100vh;
  background: radial-gradient(1200px 600px at 10% 10%, rgba(99,102,241,0.12), transparent 6%),
              radial-gradient(1000px 500px at 90% 90%, rgba(16,185,129,0.08), transparent 8%),
              linear-gradient(180deg,#0f172a 0%,#071024 100%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  color: #e6eef8;
}
.glass{
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 30px rgba(2,6,23,0.6);
}
.card:hover{
  transform: translateY(-6px);
  box-shadow: 0 16px 50px rgba(2,6,23,0.6);
}
.hidden-until-auth{ display:none; }
iframe { width:100%; height:520px; border-radius:14px; border:0; display:block; }
@media (max-width:640px){ iframe{ height:380px; } }
.muted { color: rgba(255,255,255,0.65); }
button.fullscreen-btn{ background:#2563eb; color:white; padding:0.25rem 0.5rem; border-radius:6px; font-size:0.8rem;}
</style>
</head>
<body>
<div class="min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-4xl">
<header class="mb-6 flex items-center justify-between">
  <div class="glass p-4 rounded-2xl flex items-center gap-4">
    <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-white/5">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white/90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 9l3 3-3 3M13 6h6" />
      </svg>
    </div>
    <div>
      <h1 class="text-xl font-semibold leading-tight">Cee Games Portal</h1>
      <p class="text-xs muted">Password protected • Mobile friendly</p>
    </div>
  </div>
</header>

<main class="glass p-6 rounded-3xl">

<!-- Login -->
<div id="loginCard" class="max-w-md mx-auto">
  <h2 class="text-2xl font-semibold mb-2">Enter password to continue</h2>
  <p class="text-sm muted mb-4">Client-side password — change in the HTML before publishing.</p>
  <div class="flex gap-2">
    <input id="passwordInput" type="password" placeholder="Password" class="flex-1 rounded-xl p-3 bg-white/5 border border-white/6" />
    <button id="enterBtn" class="rounded-xl px-4 py-2 bg-indigo-600 hover:bg-indigo-500">Enter</button>
  </div>
  <p id="loginMsg" class="mt-3 text-sm text-rose-400 hidden">Wrong password</p>
</div>

<!-- Content -->
<div id="content" class="hidden-until-auth mt-6">
  <!-- Controls -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold mb-3">Portal Controls</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button id="copyBtn" class="glass px-4 py-3 rounded-xl w-full">Copy Cee Portal Bookmarklet</button>
      <button id="openBtn" class="glass px-4 py-3 rounded-xl w-full">Open Cloaked (test)</button>
    </div>
    <p id="bookmarkMsg" class="text-sm text-green-400 mt-2 hidden">Bookmarklet copied to clipboard.</p>
  </div>

  <!-- Games -->
  <div>
    <h3 class="text-lg font-semibold mb-4">Games</h3>
    <div class="grid grid-cols-1 gap-6">

      <!-- Game template function used below -->
    </div>
  </div>
</div>
</main>
</div>
</div>

<script>
/**************** CONFIG ****************/
const PASSWORD = "letmein";
/*****************************************/

const loginCard = document.getElementById('loginCard');
const content = document.getElementById('content');
const enterBtn = document.getElementById('enterBtn');
const passwordInput = document.getElementById('passwordInput');
const loginMsg = document.getElementById('loginMsg');
const AUTH_KEY = 'cee_games_portal_authed_v2';

function setAuthed(){ sessionStorage.setItem(AUTH_KEY,'1'); showContent(); }
function isAuthed(){ return sessionStorage.getItem(AUTH_KEY)==='1'; }
function showContent(){ loginCard.style.display='none'; content.style.display='block'; }
if(isAuthed()) showContent();

enterBtn.addEventListener('click', ()=>{
  if(passwordInput.value===PASSWORD){
    setAuthed();
    passwordInput.value='';
    loginMsg.classList.add('hidden');
  } else loginMsg.classList.remove('hidden');
});
passwordInput.addEventListener('keydown',e=>{ if(e.key==='Enter') enterBtn.click(); });

function toggleGame(id){
  const frame=document.getElementById(id);
  const wrap=frame.parentElement;
  if(!wrap) return;
  wrap.classList.toggle('hidden');
  if(!wrap.classList.contains('hidden')) wrap.scrollIntoView({behavior:'smooth',block:'center'});
}

function fullscreenGame(id){
  const iframe=document.getElementById(id);
  if(iframe.requestFullscreen) iframe.requestFullscreen();
  else if(iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
  else if(iframe.msRequestFullscreen) iframe.msRequestFullscreen();
}

// Bookmarklet
function makeBookmarklet(portalURL){
  const js=`(async()=>{try{const w=window.open('about:blank','_blank');if(!w){alert('Popups blocked');return;}const res=await fetch('${portalURL}',{cache:'no-store'});const html=await res.text();w.document.open();w.document.write(html);const base=w.document.createElement('base');base.href='${portalURL}';w.document.head.appendChild(base);w.document.close();try{w.history.replaceState({},'','${portalURL}');}catch(e){} }catch(e){alert('Failed: '+e);} })();`;
  return 'javascript:'+js.replace(/\s+/g,' ');
}
async function copyBookmarkletToClipboard(){
  const portalURL=window.location.origin+window.location.pathname;
  const bookmarklet=makeBookmarklet(portalURL);
  try{ await navigator.clipboard.writeText(bookmarklet); document.getElementById('bookmarkMsg').classList.remove('hidden'); setTimeout(()=>document.getElementById('bookmarkMsg').classList.add('hidden'),2000);}catch(e){alert('Copy failed. Use manually:\\n'+bookmarklet);}
}
async function openCloakedNow(){
  const portalURL=window.location.origin+window.location.pathname;
  const js=makeBookmarklet(portalURL);
  const inner=js.replace(/^javascript:/,''); eval(inner);
}
document.getElementById('copyBtn').addEventListener('click', copyBookmarkletToClipboard);
document.getElementById('openBtn').addEventListener('click', openCloakedNow);

// --- Generate Game Cards dynamically ---
const games=[
  {name:"Drift Boss", path:"games/driftboss/index.html", desc:"Tap or swipe to drift."},
  {name:"Subway Surfers", path:"games/subwaysurfers/index.html", desc:"Mobile-style endless runner."},
  {name:"Gunspin", path:"games/gunspin/index.html", desc:"Shoot targets fast."},
  {name:"Doodle Jump", path:"games/doodlejump/index.html", desc:"Jump as high as possible."},
  {name:"WeBecome", path:"games/webecome/index.html", desc:"Interactive story/game."}
];

const gamesContainer=document.querySelector('#content .grid.grid-cols-1.gap-6');
games.forEach((g,i)=>{
  const card=document.createElement('div');
  card.className='card glass p-4 rounded-2xl';
  card.innerHTML=`
    <div class="flex items-center justify-between mb-2">
      <div>
        <div class="font-semibold text-lg">${g.name}</div>
        <div class="text-xs muted">${g.desc}</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleGame('gameFrame${i}')" class="px-3 py-1 rounded-md bg-indigo-600 text-white text-sm">Play/Hide</button>
        <button onclick="fullscreenGame('gameFrame${i}')" class="fullscreen-btn">Full Screen</button>
        <a href="${g.path}" target="_blank" rel="noopener" class="px-3 py-1 rounded-md bg-white/6 hover:bg-white/10 text-sm">Open raw</a>
      </div>
    </div>
    <div id="wrap${i}" class="hidden mt-3">
      <iframe id="gameFrame${i}" src="${g.path}" loading="lazy"></iframe>
    </div>
  `;
  gamesContainer.appendChild(card);
});
</script>
</body>
</html>
